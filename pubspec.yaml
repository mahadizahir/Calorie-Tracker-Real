name: flutter_application_1
description: A new Flutter project.

# Prevents accidental publishing to pub.dev
publish_to: 'none'

# App versioning: versionCode + versionName
version: 1.0.0+1

# Minimum SDK version
environment:
  sdk: ^3.7.2

# ---------------------------
# Regular Dependencies
# ---------------------------
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  fl_chart: ^1.0.0
  flutter_local_notifications: ^19.2.1
  permission_handler: ^12.0.0+1
  timezone: ^0.10.1

# ---------------------------
# Development Dependencies
# ---------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ---------------------------
# Flutter Specific Settings
# ---------------------------
flutter:
  uses-material-design: true

  # To add images or other assets, uncomment and include them here:
